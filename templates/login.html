
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SafePath AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #071827;
      color: #eaf4ff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #10283b;
      border: 1px solid #24465f;
      border-radius: 18px;
    }
    h1 span { color: #4cb5ff; }
    p { color: #adc3d8; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #35566d;
      background: #081d2c;
      color: white;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #168cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #70c8ff; }
    .message {
      padding: 10px;
      margin: 10px 0;
      background: #402633;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>SafePath <span>AI</span></h1>
    <p>Sign in to report and review accessibility hazards.</p>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="40"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
  </main>
</body>
</html>
