```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SafePath AI</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #071827;
            color: #eaf4ff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(400px, 92%);
            padding: 30px;
            border: 1px solid #24465f;
            border-radius: 18px;
            background: #10283b;
        }

        h1 span { color: #4cb5ff; }
        p { color: #adc3d8; line-height: 1.5; }

        label {
            display: block;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #35566d;
            border-radius: 8px;
            background: #081d2c;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: 0;
            border-radius: 8px;
            background: #168cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a { color: #70c8ff; }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: #402633;
            color: #ffd8df;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Create SafePath <span>AI</span> Account</h1>
        <p>Create an account to access your dashboard.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                minlength="3"
                maxlength="40"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </main>
</body>
</html>
```
